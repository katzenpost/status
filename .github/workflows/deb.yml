name: debian package

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:13
    container:
      image: ${{ matrix.image }}
    steps:
      - name: install the build dependencies
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts lintian make systemd \
            dh-python python3-all flit pybuild-plugin-pyproject \
            equivs python3-pip python3-venv python3-setuptools \
            python3-setuptools-scm python3-dev \
            python3-wheel curl git unzip ca-certificates \
            python3-pytest \
            python3-cbor2 python3-click python3-coloredlogs python3-rich \
            python3-toml python3-tomli \
            python3-pygments \
            dpkg-dev
      - uses: actions/checkout@v4
      - name: build, lint and prove the bytes reproduce
        run: make deb-ci
      - name: what was built
        run: |
          deb=$(ls -1t ../katzenpost-status_*_all.deb | head -1)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
